name: Sync Listings

# Läuft alle 3 Stunden (UTC; seit 21.09.2026 – öffentliches Repository, keine Minutenbegrenzung) und auf Knopfdruck.
# Holt die Bestände aller aktiven Provider und schreibt sie häppchenweise in die Turso-Datenbank (Zwischenstände sind
# schon während des Laufs sichtbar). Encar wird über den Residential-Proxy abgerufen (ENCAR_PROXY_URL).
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      encar_limit_partition:
        description: 'Max. Inserate je Teilabfrage (Test: z. B. 500)'
        required: false
        default: ''
      only:
        description: 'Nur diese Provider (kommagetrennt, z. B. olx,subito,sauto) – leer = alle'
        required: false
        default: ''
      reference_max_per_run:
        description: 'Vergleichspreise: Buckets je Lauf (leer = Variable bzw. 1500)'
        required: false
        default: ''
      reference_max_minutes:
        description: 'Vergleichspreise: Zeitbudget in Minuten (leer = Variable bzw. 45)'
        required: false
        default: ''

concurrency:
  group: sync-listings
  cancel-in-progress: false

jobs:
  sync:
    # Variable RUNNER=self-hosted verlegt den Lauf auf einen eigenen Runner (Teil L in docs/deployment.md): im privaten
    # Repository sind GitHub-Runner auf 2.000 Minuten je Monat begrenzt – Sync + Vergleichspreise brauchen ~900 am Tag
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # Sync (Encar 10–70 min mit Wiederholungen) + Vergleichspreise (Zeitbudget, manuell bis ~2 h); Lauf 25 lief mit 180 min ins Limit
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Proxy-Check (Austritts-IP und Encar durch den Tunnel)
        env:
          ENCAR_PROXY_URL: ${{ secrets.ENCAR_PROXY_URL }}
        run: |
          if [ -z "$ENCAR_PROXY_URL" ]; then echo "ENCAR_PROXY_URL fehlt"; exit 0; fi
          echo "Runner-IP (direkt):"; curl -s --max-time 15 https://ipinfo.io/json | head -c 300; echo
          echo "Austritts-IP über Proxy:"; curl -s --max-time 30 -x "$ENCAR_PROXY_URL" https://ipinfo.io/json | head -c 300; echo
          echo "Encar-Liste über Proxy (Status/Zeit):"
          curl -s -o /dev/null --max-time 40 -x "$ENCAR_PROXY_URL" -w "HTTP %{http_code} · connect %{time_connect}s · total %{time_total}s\n" \
            "https://api.encar.com/search/car/list/premium?count=true&q=(And.Hidden.N._.CarType.Y.)&sr=%7CModifiedDate%7C0%7C1" || echo "curl exit $?"
      - name: Sync → Turso
        working-directory: backend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ENCAR_PROXY_URL: ${{ secrets.ENCAR_PROXY_URL }}
          ENABLE_MOCK_PROVIDER: 'false'
          ENCAR_ENABLED: 'true'
          # Auf dem Runner kommt curl durch den Proxy zuverlässig zu Encar, der Node-Tunnel nicht
          HTTP_CLIENT: 'curl'
          ENCAR_LIMIT_PARTITION: ${{ github.event.inputs.encar_limit_partition }}
          SYNC_ONLY: ${{ github.event.inputs.only }}
          # Süd-/Osteuropa: keyless Frontend-Endpunkte (Grauzone wie Encar) – hier einschalten, sobald `npm run probe` sie bestätigt hat
          OLX_ENABLED: ${{ vars.OLX_ENABLED || 'false' }}
          OLX_SITES: ${{ vars.OLX_SITES }}
          SUBITO_ENABLED: ${{ vars.SUBITO_ENABLED || 'false' }}
          SAUTO_ENABLED: ${{ vars.SAUTO_ENABLED || 'false' }}
          # Optionaler Residential-Proxy für die Europa-Seiten (leer = direkt vom Runner)
          EUROPE_PROXY_URL: ${{ secrets.EUROPE_PROXY_URL }}
          # Partner-Feeds (JSON-Array, leer = keine)
          PARTNER_FEEDS: ${{ secrets.PARTNER_FEEDS }}
          # USA: Copart-Suchendpunkt (kein Key) – einschalten, sobald `npm run probe -- copart` ihn bestätigt hat
          COPART_ENABLED: ${{ vars.COPART_ENABLED || 'false' }}
          COPART_MAKES: ${{ vars.COPART_MAKES }}
          COPART_PROXY_URL: ${{ secrets.COPART_PROXY_URL }}
          # Kanada: derselbe Endpunkt auf copart.ca – einschalten, sobald `npm run probe -- copart ca` ihn bestätigt hat
          COPART_CA_ENABLED: ${{ vars.COPART_CA_ENABLED || 'false' }}
          # Japan: Jap Carz JSON-API (kein Key, Probe 20.09.2026 bestätigt) – Standard an, Variable JAPCARZ_ENABLED=false schaltet ab
          JAPCARZ_ENABLED: ${{ vars.JAPCARZ_ENABLED || 'true' }}
          JAPCARZ_PROXY_URL: ${{ secrets.JAPCARZ_PROXY_URL }}
          # VAE: Dubizzle-Algolia-Proxy (kein Key) – einschalten, sobald `npm run probe -- dubizzle` ihn bestätigt hat
          DUBIZZLE_ENABLED: ${{ vars.DUBIZZLE_ENABLED || 'false' }}
          DUBIZZLE_PROXY_URL: ${{ secrets.DUBIZZLE_PROXY_URL }}
          # weitere Provider-Keys hier ergänzen, z. B. APIBARA_API_KEY: ${{ secrets.APIBARA_API_KEY }}
        run: node --import tsx src/cli/sync.ts
      - name: Vergleichspreise DE (mobile.de) → Turso
        # Standard an; Variable REFERENCE_ENABLED=false schaltet ab. Je Lauf höchstens REFERENCE_MAX_PER_RUN Buckets (Standard 1500).
        # always(): auch wenn der Sync rot endet (z. B. Encar 403), sonst blieben die Kacheln ohne Vergleichspreis
        if: ${{ always() && vars.REFERENCE_ENABLED != 'false' }}
        working-directory: backend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          REFERENCE_ENABLED: ${{ vars.REFERENCE_ENABLED || 'true' }}
          # url = search.html-Adresse als Parameter (bestätigt); query liefert HTTP 400
          REFERENCE_MOBILE_MODE: ${{ vars.REFERENCE_MOBILE_MODE || 'url' }}
          REFERENCE_MAX_PER_RUN: ${{ github.event.inputs.reference_max_per_run || vars.REFERENCE_MAX_PER_RUN || '1500' }}
          REFERENCE_MAX_MINUTES: ${{ github.event.inputs.reference_max_minutes || vars.REFERENCE_MAX_MINUTES || '45' }}
          REFERENCE_MAKE_IDS: ${{ vars.REFERENCE_MAKE_IDS }}
          REFERENCE_PROXY_URL: ${{ secrets.REFERENCE_PROXY_URL }}
          REFERENCE_CONCURRENCY: ${{ vars.REFERENCE_CONCURRENCY || '2' }}
        run: node --import tsx src/cli/reference.ts
