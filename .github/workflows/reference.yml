name: Reference Prices

# Vergleichspreise DE (mobile.de) stündlich nachladen (seit 21.09.2026; zwei Buckets parallel) – zusätzlich zum Schritt
# im Sync-Workflow. Die Concurrency-Gruppe verhindert überlappende Läufe; danach erneuert der Job Buckets, die älter
# als REFERENCE_TTL_DAYS sind. Abschalten: Variable REFERENCE_ENABLED=false.
# Hinweis 21.09.2026: nach dem Wechsel auf „öffentlich“ feuerte der Zeitplan ab 07:12 UTC nicht mehr (auch der Sync
# nicht); eine Änderung an der Workflow-Datei auf main registriert den Zeitplan neu. Bleibt er aus: Actions →
# Workflow → „Enable workflow“ prüfen.
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      reference_max_per_run:
        description: 'Buckets je Lauf (leer = Variable bzw. 1500)'
        required: false
        default: ''
      reference_max_minutes:
        description: 'Zeitbudget in Minuten (leer = Variable bzw. 50; Maximum ~340, der Job endet nach 360)'
        required: false
        default: ''
      concurrency:
        description: 'Parallele mobile.de-Anfragen (leer = Variable bzw. 2; 4 für einen Nachhol-Lauf, bei 403/429 bricht der Job ab)'
        required: false
        default: ''

concurrency:
  group: reference-prices
  cancel-in-progress: false

jobs:
  reference:
    # Variable RUNNER=self-hosted → eigener Runner (Teil L in docs/deployment.md), sonst GitHub-Runner (Minutenkontingent)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # GitHub-Maximum je Job; der stündliche Lauf endet über REFERENCE_MAX_MINUTES (50) viel früher, ein manueller
    # Nachhol-Lauf (alle fehlenden Buckets, 21.09.2026) darf bis zu ~340 Minuten laufen
    timeout-minutes: 360
    if: ${{ vars.REFERENCE_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Vergleichspreise DE (mobile.de) → Turso
        working-directory: backend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          REFERENCE_ENABLED: 'true'
          REFERENCE_MOBILE_MODE: ${{ vars.REFERENCE_MOBILE_MODE || 'url' }}
          REFERENCE_MAX_PER_RUN: ${{ github.event.inputs.reference_max_per_run || vars.REFERENCE_MAX_PER_RUN || '1500' }}
          REFERENCE_MAX_MINUTES: ${{ github.event.inputs.reference_max_minutes || vars.REFERENCE_MAX_MINUTES || '50' }}
          REFERENCE_MAKE_IDS: ${{ vars.REFERENCE_MAKE_IDS }}
          REFERENCE_PROXY_URL: ${{ secrets.REFERENCE_PROXY_URL }}
          # Parallele mobile.de-Anfragen (Standard 2); bei 403/429 auf 1 zurück
          REFERENCE_CONCURRENCY: ${{ github.event.inputs.concurrency || vars.REFERENCE_CONCURRENCY || '2' }}
        run: node --import tsx src/cli/reference.ts
